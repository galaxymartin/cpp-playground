name: build

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OWNER: ${{ github.repository_owner }}
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_USE_NUGET_CACHE: 1
  VCPKG_NUGET_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
  VCPKG_DEFAULT_TRIPLET: x64-linux

jobs:
  linux:
    runs-on: ubuntu-24.04
    container:
      image: fedora@sha256:f717d3f59ea0dc45d3c024c9477e786bab7d418d26636920d17b48016f1e69ca

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          dnf install -y \
            cmake \
            curl \
            gcc-c++ \
            git \
            flex \
            bison \
            kernel-headers \
            mold \
            mono-core \
            ninja-build \
            perl-IPC-Run \
            perl-IPC-Cmd \
            perl-Time-Piece \
            perl-File-Compare \
            perl-File-Copy \
            perl-FindBin \
            pkgconf-pkg-config \
            python3 \
            tar \
            unzip \
            which \
            zip
          dnf clean all

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Select vcpkg binary cache mode
        env:
          PAT: ${{ secrets.VCPKG_PAT_TOKEN }}
        run: |
          if [[ -n "${PAT}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              mode=read
            else
              mode=readwrite
            fi

            echo "VCPKG_BINARY_SOURCES=clear;nuget,${FEED_URL},${mode}" >> "${GITHUB_ENV}"
          else
            echo "VCPKG_BINARY_SOURCES=default,readwrite" >> "${GITHUB_ENV}"
          fi

      - name: Configure GitHub Packages source
        env:
          PAT: ${{ secrets.VCPKG_PAT_TOKEN }}
        run: |
          if [[ -z "${PAT}" ]]; then
            echo "VCPKG_PAT_TOKEN is not set; using the default local vcpkg cache only."
            exit 0
          fi

          mono "$(./vcpkg/vcpkg fetch nuget | tail -n 1)" \
            sources remove \
            -Name GitHubPackages || true

          mono "$(./vcpkg/vcpkg fetch nuget | tail -n 1)" \
            sources add \
            -Source "${FEED_URL}" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${OWNER}" \
            -Password "${PAT}"

          mono "$(./vcpkg/vcpkg fetch nuget | tail -n 1)" \
            setapikey "${PAT}" \
            -Source "${FEED_URL}"

      - name: Install vcpkg dependencies (populate binary cache)
        run: |
          ./vcpkg/vcpkg install --manifest --triplet ${VCPKG_DEFAULT_TRIPLET} --clean-after-build --recurse

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Upload vcpkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-archive
          path: vcpkg

